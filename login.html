<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script defer src="login.js"></script>
    <title>Área de Login | BOOK'S</title>
</head>
<body>

    <main>
        <!-- Lado Esquerdo: Imagem -->
        <section class="sessao-imagem">
            <img src="img4.jpg" alt="Capa Book's">
        </section>
        
        <!-- Lado Direito: Formulário de Login -->
        <section class="sessao-login">
            <div class="area-titulo">
                <h1><span>BOOK'S</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>

            <form class="form-login" action="#">
                <div class="campo-input">
                    <label for="email">E-mail de Acesso</label>
                    <input type="text" id="email" placeholder="Informe seu email">
                </div>

                <div class="campo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Informe sua senha">
                </div>

                <div class="opcoes-login">
                    <label class="lembrar">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="" class="esqueci-senha">Esqueceu a senha?</a>
                </div>

                <!-- Corrigido o espaço no id -->
                <p id="msg-login"></p> 

                <!-- Adicionado id="btn-acessar" ao botão -->
                <button type="submit" id="btn-acessar" class="btn-login">ENTRAR</button>

                <p class="criar-conta">
                    Ainda não é um leitor? <a href="cadastro.html">Cadastre-se</a>
                </p>
            </form>
        </section>
    </main> 
</body>
</html>
