<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Área de Cadastro | BOOK'S</title>
</head>
<body>

    <main>
        <!-- Lado Esquerdo: Imagem -->
        <section class="sessao-imagem">
            <!-- ============================================= -->
            <!-- SUBTITUA 'img4.jpg' PELA SUA IMAGEM DA MÃO/LIVRO -->
            <!-- ============================================= -->
            <img src="img4.jpg" alt="Capa Book's">
        </section>
        
        <!-- Lado Direito: Formulário de Cadastro -->
        <section class="sessao-login">
            <div class="area-titulo">
                <h1><span>BOOK'S</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>

            <form class="form-login" action="#">
                <div class="campo-input">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="campo-input">
                    <label for="email">E-mail ou Tomo de Acesso</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="campo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>

                <!-- CAMPO ADICIONADO: CONFIRMAR SENHA -->
                <div class="campo-input">
                    <label for="confirmar-senha">Confirme a Senha</label>
                    <input type="password" id="confirmar-senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">CADASTRAR</button>

                <p class="criar-conta">
                    Já é um leitor? <a href="login.html">Faça Login</a>
                </p>
            </form>
        </section>
    </main>

</body>
</html>
