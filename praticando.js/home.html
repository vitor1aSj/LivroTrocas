<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Praticando</title>
</head>

<body>

    <main>
        <h1>Praticando Java Script</h1>
        <section>
            <h2>Trocar um nome na tela </h2>
            <input type="text" id="nome-entrada" placeholder="Informe seu nome ">
            <button id="btn-troca"> Trocar nome </button>
            <p> Olá <b id="nome-saida"> Visitantes </b></p>
        </section>
        <section>
            <h2>Alterando a cor da caixa</h2>
            <div id="caixa"> Aqui a caixa</div>
            <button id="btn_vermelho" class="btn">VERMELHO</button>
            <button id="btn_preto" class="btn">PRETO</button>
            <button id="btn_branco" class="btn">BRANCO</button>
        </section>

        <h2>Simulando adição e subtração de valor</h2>
        <section class="area_add_sub">

            <button id="btn_mais"> + </button>
            <p id="valor_real"> 0 </p>
            <button id="btn_menos"> - </button>
        </section>

        <h2> Adicionando Livros</h2>
        <section class="area-livros">
            <input type="text" id="nome_livro">
            <button id="adiciona_livro"> Adicionar </button>
            <button id="remover_livro"> Remover </button>

            <ul id="lista_livros"></ul>
        </section>

    </main>
    <script src="home.js"></script>
</body>

</html>
